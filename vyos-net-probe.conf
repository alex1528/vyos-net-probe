# =====================================================================
#  出口分流监控探针（vyos-net-probe）—— 独立 nginx 站点配置
#  监听独立端口 8080，根路径 / 提供看板（反代到本地探针 127.0.0.1:8899）
# ---------------------------------------------------------------------
#  为什么用独立端口 8080（彻底规避 80/443 端口博弈）：
#    - VyOS 未启用 HTTPS 时：default 站点占用 80 default_server，抢 80 会冲突
#    - VyOS 已启用 HTTPS 时：default 占 443；若再启用 enable-http-redirect，
#      VyOS 会在 80 生成 301→443 重定向，明文 80 访问会被强制跳转
#    → 用 8080 独立端口，无论 VyOS 如何配置 80/443 都零冲突，且绝不触碰
#      VyOS 自动生成的 /etc/nginx/sites-enabled/{default,https-default}
# ---------------------------------------------------------------------
#  安装（VyOS 1.5.0 / Debian nginx）：
#    sudo cp vyos-net-probe.conf /etc/nginx/sites-available/vyos-net-probe
#    sudo ln -sf /etc/nginx/sites-available/vyos-net-probe /etc/nginx/sites-enabled/vyos-net-probe
#    sudo nginx -t && sudo systemctl reload nginx   # nginx 未运行则 systemctl start nginx
#  访问： http://<VyOS网关IP>:8080/
#  改端口：修改下方 listen 端口后重载 nginx；如需放行防火墙见 README
# =====================================================================

server {
    # 独立端口 8080，不使用 default_server，与 VyOS 的 80/443 站点完全隔离
    listen 8080;
    listen [::]:8080;
    server_name _;

    # 访问日志（可按需关闭）
    access_log /var/log/nginx/vyos-net-probe.access.log;
    error_log  /var/log/nginx/vyos-net-probe.error.log warn;

    # 仅允许内网访问（按需调整/放开）
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny  all;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 健康检查直通（探针服务 /healthz）
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8899/healthz;
    }

    # 根路径 → 探针服务（看板页面 + /api/*）
    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 探针需 curl 实时探测(已并行化，总耗时≈最慢单探针)；留足余量防 504/BrokenPipe
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }
}
